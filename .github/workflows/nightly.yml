name: Nightly

# 每天从 main 构建一次：npm 包以 nightly dist-tag 发到 GitHub Packages，镜像以
# nightly tag 发到 GHCR，三个口味的 bundle 以 nightly 这个 tag 发到 AtomGit 的
# 发行仓库（国内下载走那条路，见 .agents/notes 里的 atomgit-release-assets 记录）。
# 不建 GitHub Release、不打 git tag —— 日期 tag 属于正式版本，nightly 的可变引用
# 只有 registry 上的 dist-tag、镜像 tag 和发行仓库里的 nightly tag。
#
# cron 走 UTC：0:00 UTC 是北京时间 08:00，要北京时间 0:00 就写 '0 16 * * *'。
#
# 这里的 schedule 用 ATOMGIT_KEY，所以只在「仓库自己的 schedule 还跑得动」时发
# AtomGit：fork、手动触发、key 没配都会跳过这一步，但 nightly 的包与镜像照发。
# 账户额度用尽时 GitHub 会停掉本仓库的公开 schedule，那个月的 nightly 改由
# .cnb.yml 里同一条 crontab 补（那里用得着 CNB 的定时任务）。

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

# 只有一个 job 需要它，但 GitHub 不允许把仓库级的 secret 直接写在
# `if: secrets.X != ''` 里；env 可以，而 job 的 if 看得见 env。
env:
  ATOMGIT_KEY: ${{ secrets.ATOMGIT_KEY }}

jobs:
  build:
    name: Build bundle and image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      # nightly 版本号 = 当前包版本 + 日期，registry 上每天唯一，semver 上仍排在
      # 对应的正式版本之下。同一天重跑会因为已存在而跳过发布。
      - name: Resolve nightly version
        id: version
        run: |
          set -euo pipefail
          date="$(date -u +%Y%m%d)"
          base="$(node -p "require('./packages/coding-agent/package.json').version")"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "version=$base-nightly.$date" >> "$GITHUB_OUTPUT"

      - name: Generate release model data
        run: pnpm run generate:models

      # build-single-file.mjs 自己跑 pnpm install 与 build:offline，产物与正式
      # 发布那份 nanopi.js 同一条路径。
      - name: Build single-file bundle
        run: node scripts/build-single-file.mjs --offline-model-data --out release-assets

      # 三个口味共用这一次 install/build，只有 bundle 那一步看
      # NANOPI_BUILD_FLAVOR；构建与冒烟都在 scripts/publish-atomgit.mjs 之外，
      # 脚本只管「发什么、怎么命名、校验和对不对得上、推到哪里」。
      - name: Build smaller flavors
        run: |
          set -euo pipefail
          for flavor in base minimal; do
            NANOPI_BUILD_FLAVOR="${flavor}" node scripts/build-coding-agent-single-file.mjs --out "release-assets/nanopi-${flavor}.js"
          done

      - name: Smoke-test bundle
        run: |
          set -euo pipefail
          for bundle in nanopi nanopi-base nanopi-minimal; do
            node "release-assets/${bundle}.js" --version
            node "release-assets/${bundle}.js" --help > /dev/null
          done

      # 下游是独立的 job，只能通过 artifact 拿到产物。
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

      # GHCR 要求仓库名小写，owner 是大小写混写的。
      - name: Resolve image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/nanopi" >> "$GITHUB_ENV"

      # 镜像发 linux/amd64 与 linux/arm64；runner 是 amd64，arm64 走 QEMU。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build and push nightly image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          cp release-assets/nanopi.js nanopi.js
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:nightly" \
            --tag "$IMAGE:nightly-$DATE" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --push \
            .

  # 国内用户下载 bundle 只有 AtomGit 一条路（GitHub Releases 到不了），所以
  # nightly 也要发过去。tag 就是 `nightly`：它表示「当前最新一份」，当天重跑、
  # CNB 那条兜底 cron 都落在同一个 tag 上（脚本里 tag 是 force 更新的）。
  publish-atomgit:
    name: Publish nightly bundle to AtomGit
    runs-on: ubuntu-latest
    needs:
      - build
    # 没配 key 就别跑：这一步需要往别人的仓库推东西，fork 上永远没有。
    if: ${{ env.ATOMGIT_KEY != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # --commit 记进 README 与 release notes：这份 nightly 是从哪个提交构建的。
      - name: Publish to AtomGit
        env:
          ATOMGIT_KEY: ${{ env.ATOMGIT_KEY }}
        run: |
          set -euo pipefail
          node scripts/publish-atomgit.mjs \
            --tag nightly \
            --commit "${GITHUB_SHA}" \
            --input release-assets \
            --work "${RUNNER_TEMP}/atomgit-assets" \
            --token-env ATOMGIT_KEY \
            --push

  publish-npm:
    name: Publish nightly npm package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: "@nekosekaimoe/nanopi"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate release model data
        run: pnpm run generate:models

      - name: Build packages
        run: pnpm run build

      - name: Repack under the GitHub Packages name
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/make-github-package.mjs --out "$RUNNER_TEMP/github-package" --version "$VERSION"

      - name: Publish package
        working-directory: ${{ runner.temp }}/github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published; skipping."
            exit 0
          fi
          # nightly 只动 nightly dist-tag，latest 留给正式发布。
          npm publish --ignore-scripts --tag nightly
