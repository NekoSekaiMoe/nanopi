name: CI

on:
  # push 也要跑：直推 main 的提交（含从 CNB 镜像过来的合并提交）同样要过
  # build/check/test。merge-result 是「PR 合进 main 会不会丢东西」，push 事件下
  # 没有可比的 base，那一步按 base 是否存在分流，见下。
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 的改动合进 main 会不会丢东西：与 .cnb.yml 的 pull_request.target 同一条检查，
  # 逻辑在 scripts/check-merge-result.mjs。脚本只读 git 对象，不需要装依赖，所以并进
  # build-check-test 作为一个步骤，不单独占一个 runner。
  #
  # fetch-depth: 0 是必须的：浅 clone 没有与 base 的合并基点，脚本会以「base 缺失」退出 2。
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: npm install -g pnpm@12.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Check merge result
        # 用 PR 合并后的提交与 base 比：base 有的文件在结果里必须还在（#242 的
        # b3ffe400 用旧树盖掉了 c897cdf2，父链没断，只有比树才看得出来）。
        #
        # push 上没有 base：github.base_ref 为空时这个步骤不跑，省得用空 ref 让脚本
        # 退出 2（#258）。直推 main 的回退由 CNB 侧 mirror-main.mjs 拦。
        if: github.base_ref != ''
        run: node scripts/check-merge-result.mjs --base "refs/remotes/origin/${{ github.base_ref }}"

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test
