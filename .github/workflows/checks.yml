name: Checks

# job 名必须是 build-check-test，不能改。
#
# GitHub ruleset 的必选检查（实测 ruleset 26337009，context=build-check-test，
# integration_id=15368 指向 GitHub Actions）匹配的是 check-run 的 name，也就是这里
# 的 job 名，与工作流 `name:`/文件名无关（#419 当初以为是 `<工作流名> / <job 名>`
# 全名、且记成小写 ci，与实测不符）。改名后 ruleset 不必跟着改，但改 job 名会立刻
# 让必选检查落空、所有 PR 卡住。
#
# 文件叫 checks.yml、工作流叫 Checks 只是 #420 定的命名统一，保留不动即可；真正
# 决定「绿了能不能合」的是 platformAutomerge（见 renovate.json）：交给 GitHub 原生
# auto-merge 才会评估这条 check-run。见
# .agents/notes/implemented/bug-fix/2026-11-05-renovate-platform-automerge.md。

on:
  # push 也要跑：直推 main 的提交（含从 CNB 镜像过来的合并提交）同样要过
  # build/check/test。merge-result 是「PR 合进 main 会不会丢东西」，push 事件下
  # 没有可比的 base，那一步按 base 是否存在分流，见下。
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 的改动合进 main 会不会丢东西：与 .cnb.yml 的 pull_request.target 同一条检查，
  # 逻辑在 scripts/check-merge-result.mjs。脚本只读 git 对象，不需要装依赖，所以并进
  # build-check-test 作为一个步骤，不单独占一个 runner。
  #
  # fetch-depth: 0 是必须的：浅 clone 没有与 base 的合并基点，脚本会以「base 缺失」退出 2。
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 工作流文件本身的语法错误，`pnpm run check` 抓不到：biome 只覆盖 *.ts，而一份
      # 解析失败的工作流不产生 check-run，ruleset 的必选检查也不会拦，结果就是整条
      # 流水线静默不跑（#530、#569：job 级 `if` 读了不允许的 `env` 上下文，两个发布
      # job 一个都没跑过）。actionlint 报的就是 GitHub 那句 `Invalid workflow file`
      # 的同一条错误，本地能跑、CI 能拦，是这条缺口最便宜的补法。
      #
      # 带上 shellcheck 是因为 `run:` 块里同样的错只会在运行时炸：把两个参数塞进一个
      # 变量再展开（`GH_REPO_FLAG="-R org/repo"`）平时能跑，仓库名带空格或空值就散架。
      # pyflakes 关掉：仓库里没有 Python 步骤，装了也只会拖长装依赖的时间。
      #
      # 两个二进制都来自 GitHub Releases，不经 npm，Renovate 管不到，所以版本与
      # sha256 一起钉死在这里。升级时成对改：版本号、URL 里的版本号、校验和。
      #
      # 放在 checkout 之后、装依赖之前：工作流写坏了应该 10 秒内红，而不是等一轮
      # 完整的 build。
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/workflow-lint"
          mkdir -p "${tools}"
          fetch() {
            curl -fsSL --retry 3 -o "${tools}/$1" "$2"
            echo "$3  ${tools}/$1" | sha256sum -c -
          }
          fetch actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}"
          fetch shellcheck.tar.gz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            "${SHELLCHECK_SHA256}"
          tar -xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint
          tar -xzf "${tools}/shellcheck.tar.gz" -C "${tools}"
          "${tools}/actionlint" \
            -shellcheck "${tools}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -pyflakes=

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Check merge result
        # 用 PR 合并后的提交与 base 比：base 有的文件在结果里必须还在（#242 的
        # b3ffe400 用旧树盖掉了 c897cdf2，父链没断，只有比树才看得出来）。
        #
        # 路径消失不再一律红（#296）：PR 描述里逐条写了 `deletes: <path>` 的放行。
        # 描述从事件载荷里取，脚本本身不联网。提交消息那侧交给 --commit：结果提交是
        # GitHub 造的合并提交，`deletes:` 只会写在 PR 的提交上，所以指到 github.sha
        # （PR 分支 tip）而不是 HEAD。
        #
        # push 上没有 base：github.base_ref 为空时这个步骤不跑，省得用空 ref 让脚本
        # 退出 2（#258）。直推 main 的回退由 CNB 侧 mirror-main.mjs 拦。
        if: github.base_ref != ''
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          desc=$(mktemp)
          printf '%s\n' "$PR_BODY" > "$desc"
          node scripts/check-merge-result.mjs \
            --base "refs/remotes/origin/${{ github.base_ref }}" \
            --description-file "$desc" \
            --commit "${{ github.event.pull_request.head.sha }}"

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test
