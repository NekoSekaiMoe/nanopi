# 将 GitHub 仓库上的改动镜像推送到 CNB（cnb.cool/shinytale/nanopi），
# 与 .cnb.yml 的 mirror-to-github 互为反向。
#
# 双向镜像都不用 force push：两侧只推「远端 tip 之上的合成提交」或快进，
# 互相不覆盖。main 和 tag 的镜像逻辑与 .cnb.yml 共用 scripts/mirror-main.mjs
# 与 scripts/mirror-tags.mjs，入口都是 scripts/mirror.mjs。
# CNB_KEY 配置在 GitHub 仓库 Settings > Secrets and variables > Actions。

name: Sync to CNB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cnb
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror main and tags
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base --is-ancestor 需要完整历史
          fetch-depth: 0

      # main 与 tag 各跑一次镜像，判定在 scripts/mirror-main.mjs 与
      # scripts/mirror-tags.mjs（与 .cnb.yml 的 mirror-to-github 共用同一份逻辑）：
      # main 按树内容判定并在推送后回读比对，tag 是「远端已存在且指向同一 commit
      # 就跳过、指向不同 commit 就报错」。两者都只重试传输层失败，判定失败第一次
      # 就返回。
      #
      # 远端 URL 不带 token：CNB 对海外 IP 的匿名读返 401，所以 fetch 也必须带
      # 凭据，但 token 不该出现在 argv 与报错里。凭据由入口自己落进一个进程私有的
      # credential store（scripts/mirror.mjs），这里不碰 ~/.git-credentials。
      - name: Push main and tags to CNB
        env:
          CNB_KEY: ${{ secrets.CNB_KEY }}
        run: |
          set -euo pipefail
          remote=https://cnb.cool/shinytale/nanopi.git
          node scripts/mirror.mjs main --remote "$remote" --token-user cnb --token-env CNB_KEY
          node scripts/mirror.mjs tags --remote "$remote" --token-user cnb --token-env CNB_KEY
