# 将 GitHub 仓库上的改动镜像推送到 CNB（cnb.cool/shinytale/nanopi），
# 与 .cnb.yml 的 mirror-to-github 互为反向。
#
# 双向镜像都不用 force push：两侧只推「远端 tip 之上的合成提交」或快进，
# 互相不覆盖。main 和 tag 的镜像逻辑与 .cnb.yml 共用 scripts/mirror-main.mjs
# 与 scripts/mirror-tags.mjs。
# CNB_KEY 配置在 GitHub 仓库 Settings > Secrets and variables > Actions。

name: Sync to CNB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cnb
  cancel-in-progress: true

jobs:
  mirror:
    name: Push main to CNB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base --is-ancestor 需要完整历史
          fetch-depth: 0

      - name: Push main to CNB
        env:
          CNB_KEY: ${{ secrets.CNB_KEY }}
        run: |
          set -euo pipefail
          # CNB 对海外 IP 的匿名读会返 401，fetch 也必须带凭据。
          node scripts/mirror-main.mjs --remote "https://cnb:${CNB_KEY}@cnb.cool/shinytale/nanopi.git"

      # tag 同步与 main 是两件事：main 按内容判定加推送后树比对，tag 是「远端
      # 已存在且指向同一 commit 就跳过、指向不同 commit 就报错」。逻辑在
      # scripts/mirror-tags.mjs，与 .cnb.yml 的 push tags 共用；它和 mirror-main
      # 一样分清传输层失败（重试）与判定失败（不重试）。
      - name: Push tags to CNB
        env:
          CNB_KEY: ${{ secrets.CNB_KEY }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          printf 'https://cnb:%s@cnb.cool\n' "${CNB_KEY}" > ~/.git-credentials
          node scripts/mirror-tags.mjs --remote "https://cnb:${CNB_KEY}@cnb.cool/shinytale/nanopi.git"
