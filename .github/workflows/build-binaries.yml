name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Hydrate release model data
        run: pnpm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/nanopi-${VERSION}-source.tar.gz"

      - name: Build single-file distribution from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/nanopi-${VERSION}-source.tar.gz" -C "${build_root}"
          "${build_root}/nanopi-${VERSION}/scripts/build-single-file.sh" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"
          # Minimal flavor bundles from the same built tree; only the bundle
          # step is flavor-aware, so no second install/build is needed.
          NANOPI_BUILD_FLAVOR=minimal \
            node "${build_root}/nanopi-${VERSION}/scripts/build-coding-agent-single-file.mjs" \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries/nanopi-minimal.js"

      - name: Prepare GitHub release payload
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md

          cd packages/coding-agent/binaries

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          test -f nanopi.js
          test -f nanopi-minimal.js
          test -f "nanopi-sidecars-${FULL_VERSION}.tgz"
          cp nanopi.js nanopi-minimal.js "nanopi-sidecars-${FULL_VERSION}.tgz" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-single-file:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.event.inputs.tag || github.ref_name }}
          path: release-assets

      - name: Smoke-test single-file CLI
        shell: bash
        run: |
          set -euo pipefail

          node release-assets/nanopi.js --help
          node release-assets/nanopi.js --version
          node release-assets/nanopi-minimal.js --help
          node release-assets/nanopi-minimal.js --version

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test-single-file
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          source_asset="nanopi-${VERSION}-source.tar.gz"
          expected_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
          )

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"

          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
