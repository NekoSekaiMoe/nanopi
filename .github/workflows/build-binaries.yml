name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Generate release model data
        run: pnpm run generate:models

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          node scripts/create-source-archive.mjs \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/nanopi-${VERSION}-source.tar.gz"

      - name: Build single-file distribution from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/nanopi-${VERSION}-source.tar.gz" -C "${build_root}"
          node "${build_root}/nanopi-${VERSION}/scripts/build-single-file.mjs" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"
          # Smaller flavor bundles from the same built tree; only the bundle
          # step is flavor-aware, so no second install/build is needed. `base`
          # drops the bundled extras and peripherals, `minimal` additionally
          # registers the shell tools alone.
          for flavor in base minimal; do
            NANOPI_BUILD_FLAVOR="${flavor}" \
              node "${build_root}/nanopi-${VERSION}/scripts/build-coding-agent-single-file.mjs" \
              --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries/nanopi-${flavor}.js"
          done

      - name: Prepare GitHub release payload
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md

          cd packages/coding-agent/binaries

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          test -f nanopi.js
          test -f nanopi-base.js
          test -f nanopi-minimal.js
          test -f "nanopi-sidecars-${FULL_VERSION}.tgz"
          cp nanopi.js nanopi-base.js nanopi-minimal.js "nanopi-sidecars-${FULL_VERSION}.tgz" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-single-file:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download release payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets-${{ github.event.inputs.tag || github.ref_name }}
          path: release-assets

      - name: Smoke-test single-file CLI
        shell: bash
        run: |
          set -euo pipefail

          node release-assets/nanopi.js --help
          node release-assets/nanopi.js --version
          node release-assets/nanopi-base.js --help
          node release-assets/nanopi-base.js --version
          node release-assets/nanopi-minimal.js --help
          node release-assets/nanopi-minimal.js --version

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test-single-file
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          source_asset="nanopi-${VERSION}-source.tar.gz"
          expected_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh 由 GH_REPO 定位仓库，但 release create 仍会跑 `git tag --list`
          # 取 tag 注解。本 job 没有 checkout，工作区不是 git 仓库，那一步直接
          # 以 128 退出（`fatal: not a git repository`），draft 建不出来。
          # 用 -R 显式给仓库，gh 会跳过所有本地 git 调用。
          GH_REPO_FLAG: -R ${{ github.repository }}
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
          )

          existing_release="$(gh release view ${GH_REPO_FLAG} "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete ${GH_REPO_FLAG} "${RELEASE_TAG}" --yes
          fi

          gh release create ${GH_REPO_FLAG} "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view ${GH_REPO_FLAG} "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"

          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  # npm 包发到 GitHub Packages（npm.pkg.github.com）。位置在 stage 之后、公开
  # release 之前：包先上 registry，release 才对外，中途失败不会留下「已发布但装
  # 不上」的状态。GitHub 的 registry 要求包名带 owner scope，所以 tarball 里的
  # 名字是 @nekosekaimoe/nanopi（scripts/make-github-package.mjs），bin 仍是 nanopi。
  publish-github-packages:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: "@nekosekaimoe/nanopi"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate release model data
        run: pnpm run generate:models

      - name: Build packages
        run: pnpm run build

      - name: Repack under the GitHub Packages name
        run: node scripts/make-github-package.mjs --out "${RUNNER_TEMP}/github-package"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/github-package
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          # 原生 registry 不提供 provenance（只对 npmjs 描述），所以这里不带
          # --provenance；重新打标签不会重复发布。
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --ignore-scripts

  # 容器镜像走 ghcr.io（GitHub 文档里 container registry 用 ghcr.io，
  # docker.pkg.github.com 已废弃）。bundle 直接取构建 job 的产物，不在镜像里
  # 重新构建；只出 full 一套 tag：三个口味的差异在 bundle 内部，镜像的增量
  # （node 运行时 + git/ripgrep）对三者相同。
  build-ghcr-image:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nanopi
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Stage bundle for the image build
        run: cp release-assets/nanopi.js nanopi.js

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      # 只有 semver tag 推 latest：v20261023dev 这类预发布不该盖掉稳定别名。
      - name: Resolve image tags
        id: tags
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          tags="${IMAGE}:${TAG}"
          tags="${tags}"$'\n'"${IMAGE}:${version}"
          if [[ "${version}" =~ ^[0-9]{8}(\.[0-9]+){0,2}$ ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "list<<NANOPI_TAGS"
            echo "${tags}"
            echo "NANOPI_TAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && tag_args+=("--tag" "${tag}")
          done <<< "${TAGS}"

          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64,linux/arm64 \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --push \
            .

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同 stage-github-release：本 job 没有 checkout，gh 必须用 -R 显式
          # 指定仓库，否则它去问本地 git 取仓库信息会直接失败。
          GH_REPO_FLAG: -R ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view ${GH_REPO_FLAG} "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit ${GH_REPO_FLAG} "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 兜底 job 同样没有 checkout，gh 必须用 -R 显式指定仓库。
          GH_REPO_FLAG: -R ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view ${GH_REPO_FLAG} "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete ${GH_REPO_FLAG} "${RELEASE_TAG}" --yes
          fi
