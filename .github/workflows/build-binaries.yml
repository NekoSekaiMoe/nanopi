name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # job 级 if 读不到 env，也读不到 secrets（那里只有 github/needs/vars/inputs），
  # 所以用一个零依赖的 job 把「ATOMGIT_KEY 是否配置」翻成 needs 输出，交给
  # publish-atomgit 判断。secret 只落在要用到它的两个 step 的 env 里，不铺到
  # 工作流级（那会让每个 job 都拿到这把 key）。
  check-atomgit-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Check whether ATOMGIT_KEY is set
        id: check
        env:
          ATOMGIT_KEY: ${{ secrets.ATOMGIT_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${ATOMGIT_KEY:-}" ]]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Generate release model data
        run: pnpm run generate:models

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          node scripts/create-source-archive.mjs \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/nanopi-${VERSION}-source.tar.gz"

      - name: Build single-file distribution from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/nanopi-${VERSION}-source.tar.gz" -C "${build_root}"
          # The TUI sidecar tarball the single-file build emits always lands in
          # packages/coding-agent/binaries/, whatever --out says: there is one
          # per build, its name carries the TUI version rather than the flavor,
          # and both publish workflows read it from there.
          # repoRoot inside the extracted archive is the temporary tree, so the
          # sidecar tarball has to be pointed at the workspace explicitly.
          node "${build_root}/nanopi-${VERSION}/scripts/build-single-file.mjs" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries" \
            --sidecars-out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"
          # Smaller flavor bundles from the same built tree; only the bundle
          # step is flavor-aware, so no second install/build is needed. `base`
          # drops the bundled extras and peripherals, `minimal` additionally
          # registers the shell tools alone.
          for flavor in base minimal; do
            NANOPI_BUILD_FLAVOR="${flavor}" \
              node "${build_root}/nanopi-${VERSION}/scripts/build-coding-agent-single-file.mjs" \
              --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries/nanopi-${flavor}.js" \
              --sidecars-out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"
          done

      - name: Prepare GitHub release payload
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md

          cd packages/coding-agent/binaries

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          test -f nanopi.js
          test -f nanopi-base.js
          test -f nanopi-minimal.js
          test -f "nanopi-sidecars-${FULL_VERSION}.tgz"
          cp nanopi.js nanopi-base.js nanopi-minimal.js "nanopi-sidecars-${FULL_VERSION}.tgz" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-single-file:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.event.inputs.tag || github.ref_name }}
          path: release-assets

      # HOME 指到临时目录：bundle 启动时会去装 sidecar，装在用户目录里会让下
      # 一个 bundle 看到「已经装好」而跳过下载，这条冒烟就测不到下载路径了。
      - name: Smoke-test single-file CLI
        shell: bash
        run: |
          set -euo pipefail

          for bundle in nanopi nanopi-base nanopi-minimal; do
            home="$(mktemp -d)"
            HOME="${home}" node "release-assets/${bundle}.js" --help > /dev/null
            HOME="${home}" node "release-assets/${bundle}.js" --version
            rm -rf "${home}"
          done

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test-single-file
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"

          # Sidecars are named from the full package.json version; a date tag
          # may omit minor/patch (v20261013 -> 20261013.0.0).
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"

          source_asset="nanopi-${VERSION}-source.tar.gz"
          expected_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        # 每个 gh 调用都带 -R：gh 由 GH_REPO 定位仓库，但 release create 仍会跑
        # `git tag --list` 取 tag 注解。本 job 没有 checkout，工作区不是 git 仓库，
        # 那一步直接以 128 退出（`fatal: not a git repository`），draft 建不出来。
        # 加了 -R 的调用会跳过所有本地 git 探测。-R 与仓库名是两个参数，所以写成
        # `-R "${GH_REPO}"` 而不是把 `-R <repo>` 塞进一个变量再展开。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd release-assets

          VERSION="${RELEASE_TAG#v}"
          version_full() {
            local IFS=.
            local -a parts
            read -ra parts <<< "$1"
            echo "${parts[0]:-0}.${parts[1]:-0}.${parts[2]:-0}"
          }
          FULL_VERSION="$(version_full "${VERSION}")"
          source_asset="nanopi-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            nanopi.js
            nanopi-base.js
            nanopi-minimal.js
            "nanopi-sidecars-${FULL_VERSION}.tgz"
            SHA256SUMS
          )

          existing_release="$(gh release view -R "${GH_REPO}" "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete -R "${GH_REPO}" "${RELEASE_TAG}" --yes
          fi

          gh release create -R "${GH_REPO}" "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view -R "${GH_REPO}" "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"

          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  # npm 包发到 GitHub Packages（npm.pkg.github.com）。位置在 stage 之后、公开
  # release 之前：包先上 registry，release 才对外，中途失败不会留下「已发布但装
  # 不上」的状态。GitHub 的 registry 要求包名带 owner scope，所以 tarball 里的
  # 名字是 @nekosekaimoe/nanopi（scripts/make-github-package.mjs），bin 仍是 nanopi。
  publish-github-packages:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: "@nekosekaimoe/nanopi"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: npm install -g pnpm@12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate release model data
        run: pnpm run generate:models

      - name: Build packages
        run: pnpm run build

      - name: Repack under the GitHub Packages name
        run: node scripts/make-github-package.mjs --out "${RUNNER_TEMP}/github-package"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/github-package
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          # 原生 registry 不提供 provenance（只对 npmjs 描述），所以这里不带
          # --provenance；重新打标签不会重复发布。
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --ignore-scripts

  # 容器镜像走 ghcr.io（GitHub 文档里 container registry 用 ghcr.io，
  # docker.pkg.github.com 已废弃）。bundle 直接取构建 job 的产物，不在镜像里
  # 重新构建；只出 full 一套 tag：三个口味的差异在 bundle 内部，镜像的增量
  # （node 运行时 + git/ripgrep）对三者相同。
  build-ghcr-image:
    needs:
      - build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      source_ref: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
      asset_source: artifact

  # 国内用户下载 bundle 只有 AtomGit 一条路（GitHub Releases 到不了）。资产就是
  # stage 阶段校验过的那一份 artifact，不重新构建；tag 是这次发布的 tag 本身，
  # 所以发行仓库的 assets/<tag>/ 与 GitHub Release 上的文件名逐字相同，
  # `install.js --mirror=` 换源不用改参数。
  publish-atomgit:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
      - check-atomgit-key
    # job 级 if 看不到 env/secrets，只能读 needs 输出；没配 key（fork）就跳过整个 job。
    if: ${{ needs.check-atomgit-key.outputs.has_key == 'true' }}
    permissions:
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      # source_ref 只有发布恢复时才与 tag 不同，那时说的是「这批资产从哪个提交
      # 构建出来的」，用 parse 拿它指向的 commit 比记一个 ref 名清楚。
      - name: Resolve source commit
        id: source
        run: echo "commit=$(git rev-parse "${SOURCE_REF}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Publish to AtomGit
        env:
          ATOMGIT_KEY: ${{ secrets.ATOMGIT_KEY }}
        run: |
          set -euo pipefail
          node scripts/publish-atomgit.mjs \
            --tag "${RELEASE_TAG}" \
            --commit "${{ steps.source.outputs.commit }}" \
            --input release-assets \
            --work "${RUNNER_TEMP}/atomgit-assets" \
            --token-env ATOMGIT_KEY \
            --push

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        # 同 stage-github-release：本 job 没有 checkout，gh 必须用 -R 显式指定
        # 仓库，否则它去问本地 git 取仓库信息会直接失败。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view -R "${GH_REPO}" "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit -R "${GH_REPO}" "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        # 兜底 job 同样没有 checkout，gh 必须用 -R 显式指定仓库。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view -R "${GH_REPO}" "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete -R "${GH_REPO}" "${RELEASE_TAG}" --yes
          fi
