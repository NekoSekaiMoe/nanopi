# CNB 上的失败构建要有人接着修（#319）。
#
# 平台没有「构建失败时跑一段」的事件，但每条 pipeline 都有 endStages：stages 跑完
# 它都会跑，而且它自己的结论不影响构建状态。钩子挂在 endStages 上，而不是在每条
# 流水线里各写一段——后者一定会漏掉没人想起来的那条。
#
# 报不报由脚本自己判（读构建状态），报什么由脚本里的提交标记去重：同一条分支的
# 同一个提交只报一次。endStages 不继承 stages 的结论，所以不能靠 `if` 只让失败时跑，
# 这也是「全部流水线都挂」不会刷屏的原因。

# 将 CNB 仓库上的改动镜像推送到 GitHub（NekoSekaiMoe/nanopi）。
#
# 只在 main 的 push 事件触发；GitHub 侧的反向镜像见
# .github/workflows/sync-to-cnb.yml。为避免互相覆盖，两侧都不用 force push。
# GH_KEY 由密钥仓库 shinytale/keys 的 env.yml 注入。

# 每个 job 的 endStages 都用这一段（锚点在 YAML 里必须先定义后引用）。
# allowFailure：钩子自己出错不能把构建状态改成失败，更不能盖掉原来的失败信息。
#
# 脚本要用 cnb 读构建状态、写 Issue，所以先装 cnb；node 由 node:24 镜像自带
# （见本段 image 处的注释）。
# CNB_TOKEN 在 endStages 里默认只有构建详情只读，写 Issue 要显式加 scope。
x-notify-failure: &notify-failure
  - name: report-failure
    allowFailure: true
    # 镜像自带 node，不再 apt 装：默认构建镜像里没有 node，而 apt 装的又是
    # Debian 的 nodejs（trixie 是 20.19.2，低于本仓库的 >=24），且每次都要赌
    # 一次镜像源。cnb-knt-1k7c8jnjn 就是这么红的：Debian 源对
    # node-cjs-module-lexer 返回 404，node 没装成，脚本以 127 结束。
    image: node:24
    env:
      CNB_TOKEN_SCOPE: repo-issue:rw,repo-notes:rw,repo-cnb-history:r
    script: |
      # node:24 的 /bin/sh 是 dash，没有 pipefail；这里也没有管道。
      set -eu
      npm install -g @cnbcool/cnb-cli
      node scripts/report-failed-check.mjs

# nightly 的 bundle 发 AtomGit 只在 GitHub Actions 里跑（.github/workflows/nightly.yml），
# CNB 上曾经留过一条同时间的 crontab 兜底，已去掉（#497）：它每次都要在 CNB 上重新
# 构建一遍，而 GitHub 那边每天都会自己发一份，两次构建只是多一份存储和一个会变红的
# 定时任务。

main:
  push:
    - name: mirror-to-github
      # 2 cpus = 2c4g（内存 = CPU 核数 × 2 GiB）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      # 默认构建镜像里没有 node，此前靠每个 stage 各自 apt 装一次：装到的是 Debian
      # 的 nodejs 20（低于本仓库的 >=24），还要赌镜像源，装不上就是
      # `sh: node: command not found`（127）。整条流水线直接指 node:24，stage 里
      # 只管跑脚本；顺带省掉每次三次 apt-get update 的时间。
      # node:24 的 /bin/sh 是 dash，脚本里不要写 pipefail。
      docker:
        image: node:24
      imports:
        - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
      endStages: *notify-failure
      stages:
        # CNB 不执行本地 git hooks，也没有修改已推送提交的 API，所以
        # Change-Id 只能在 CI 里检查，补不了；这里只报告不拦截。
        - name: check-commit-trailers
          script: |
            set -eu
            # 整个流水线跑在 node:24 里（见下面的 docker.image），脚本只读 git。
            node scripts/check-commit-trailers.mjs "$CNB_BEFORE_SHA" "$CNB_COMMIT"

        # main 与 tag 各跑一次镜像。判定在 scripts/mirror-main.mjs 与
        # scripts/mirror-tags.mjs（与 GitHub 侧共用），入口是 scripts/mirror.mjs。
        # 传输层失败要重试（GitHub 偶尔在中途掐断：GnuTLS handshake failed:
        # The TLS connection was non-properly terminated），「树相同 / 非快进 /
        # tag 已指向别的 commit」这类判定重试没有意义，脚本里分得清这两类，
        # 内联 bash 分不清。凭据由入口自己落进一个进程私有的 credential store：
        # 远端 URL 不带 token，token 也不经过这里的 shell 与 ~/.git-credentials。
        - name: mirror main and tags
          script: |
            set -eu
            remote=https://github.com/NekoSekaiMoe/nanopi.git
            node scripts/mirror.mjs main --remote "$remote" --token-user x-access-token --token-env GH_KEY
            node scripts/mirror.mjs tags --remote "$remote" --token-user x-access-token --token-env GH_KEY

# PR 的预合并结果检查：这次改动合进 main 会不会丢东西。
#
# 事件选 pull_request.target 而不是 pull_request：后者拿的是「预合并后的提交」，
# 按定义已经把 main 的树合并进来了，回退永远查不出来。pull_request.target 用的是
# 合并前的目标分支最新提交，才是真正要比较的基线。反过来，它拿不到 PR 的代码，
# 所以从 CNB_PULL_REQUEST_SLUG / CNB_PULL_REQUEST_BRANCH 取源分支自己合一次。
#
# 这条流水线要变成「阻止合并」还需要在仓库设置里把 main 设为保护分支并勾选
# 「需要通过状态检查」，否则它只是一条会变红的记录。
#
# 缩进不能丢：pull_request.target 是上面 main: 的子键。e1a11be62 曾把它写成顶格的
# 第二个 main:，YAML 直接拒绝整份文件（duplicated mapping key，见 #246）。
  pull_request.target:
    - name: merge-result
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      # 同上：默认构建镜像没有 node，这里只装得起 Debian 的 node 20，还要赌镜像源。
      docker:
        image: node:24
      endStages: *notify-failure
      stages:
        - name: check-merge-result
          # fetch PR 分支、合并、比对都在 scripts/check-merge-result-cnb.mjs 里。
          # 退出码：0 通过，1 这次合并会丢 main 上已有的文件，2 base 缺失。
          script: |
            set -eu
            node scripts/check-merge-result-cnb.mjs

        # 笔记门禁（#728）：tree / format / archived 三条校验脚本会红，四问那条
        # 提醒仍然恒 0。入口是 scripts/verify-agent-notes.mjs，与 GitHub 侧
        # `.github/workflows/checks.yml` 调的是同一个文件，命令不写两遍。
        #
        # 跑在上一阶段的合并结果上（任务间共享 CNB_BUILD_WORKSPACE），所以冲突残留、
        # 合并后变成死链的笔记链接都会被抓到，不只是源分支自洽。
        #
        # 基线用 CNB_PULL_REQUEST_TARGET_SHA（目标分支最新提交）：归档 manifest 的
        # append-only 要拿「改动前」比，用 HEAD 等于没查。这跟 check-merge-result 取
        # 合并基线是同一件事，只是那边要自己 fetch 源分支。
        #
        # 三条校验脚本是 .ts，需要会剥类型的 node（process.features.typescript）：
        # Debian 的 nodejs 包没有这个能力，走 ts-import.mjs 又得先装 esbuild。
        # 流水线已经整体是 node:24，这一条不再单独指镜像；node:24 自带 git
        # （verify-archived 要用 git show 读基线 manifest）。
        - name: verify-agent-notes
          # `set -o pipefail` 在这条 Stage 里会当场退出：node:24 的 /bin/sh 是 dash，
          # dash 没有 pipefail，脚本以 `Illegal option -o pipefail` 结束，门禁从未真正
          # 跑过。这里没有管道，`set -eu` 就是全部需要的语义。
          script: |
            set -eu
            # 任务换了容器，工作区文件的所有者可能与当前用户不一致，git 会以
            # "dubious ownership" 拒绝执行——而 verify-archived 读不到 git 时会
            # 静默跳过 append-only，正好跳过这道门禁唯一的增量部分。
            git config --global --add safe.directory "${CNB_BUILD_WORKSPACE:-/workspace}"
            node scripts/verify-agent-notes.mjs --base "$CNB_PULL_REQUEST_TARGET_SHA"

# 兜底：没被上面的 main 规则接住的事件（新分支的 push、手动触发）也要有钩子。
# `$` 的匹配是在 glob 之后，两类规则不会互相顶掉。
$:
  push:
    - endStages: *notify-failure
  pull_request.target:
    - endStages: *notify-failure
  pull_request.merged:
    - endStages: *notify-failure

  # AI 助手（NPC）被 @ 时跑的流水线。cpus: 2 即 2c4g（内存 = 核数 x 2GiB）。
  #
  # NPC 按云原生开发的核时计费，所以 cpus 同时是账单口径：不写它就拿平台
  # 默认节点的 8c16g，同样的会话是 4 倍核时（#542）。tags 显式写成默认架构，
  # 免得将来默认架构变了，「2 核」的意图落空还看不出来。
  #
  # 但写了不等于生效，这一条是给下一个人的。2026-11-06 02:00 UTC 的会话
  # 实际跑在 8c16g 上，节点标签是 cpus 8 / memory 16（#542 的后续）。
  # b6aec14ea 确实写了 cpus: 2，同一提交里还给了这两条流水线 `timeout: 1h`，
  # 而它要覆盖的那份平台配置 job 也声明了 timeout——$ 下的条目是整条覆盖
  # 系统默认，只要平台那条 job 换掉或调了 timeout（1h 那版还直接写坏过构建），
  # 覆盖就落空，退回系统默认：8c16g、无 tags。
  #
  # 教训是这份配置里只有 Job 级 timeout 是平台自己也在压的量，它一改，
  # 我们整条覆盖可能失效，而「没生效」在页面上看不出来。核对方式：构建详情里
  # pipeline 的 labels 应当是 cpus 2 / memory 4，不是 8 / 16。
  #
  # 所以这里不声明 Job 级 timeout，跟着平台默认走。它也管不到会话时长：
  # npc:go 的 timeout 只作用于每一次工具执行（单次上限与连续无输出），
  # 会话整体受流水线超时 20h 约束。唯一的代价是无输出阈值回到默认 10 分钟，
  # 而 pre-commit 的 pnpm run check 在 2c4g 上可能十分钟不吐字——真要解决，
  # 该让那步分步输出，不是在流水线里跟平台对表。改这里之前先读
  # .agents/notes/implemented/process/2026-10-13-cnb-npc-git-hooks-and-runner-profile.md。
  #
  # install git hooks 这一步不能省：husky 只在 pnpm prepare 里执行，
  # 而 pnpm install 的 --ignore-scripts 会把 prepare 一起跳过。hooks 装不上时
  # .husky/commit-msg 不会运行，NPC 提交就没有 Change-Id。
  issue.comment@npc:
    - runner:
        tags: cnb:arch:amd64
        cpus: 2
      endStages: *notify-failure
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - runner:
        tags: cnb:arch:amd64
        cpus: 2
      endStages: *notify-failure
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
