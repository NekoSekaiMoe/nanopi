# 将 CNB 仓库上的改动镜像推送到 GitHub（NekoSekaiMoe/nanopi）。
#
# 只在 main 的 push 事件触发；GitHub 侧将来会有推回 CNB 的 workflow，
# 为避免互相覆盖，这里不用 force push。
# GH_KEY 由密钥仓库 shinytale/keys 的 env.yml 注入。

main:
  push:
    - name: mirror-to-github
      # 2 cpus = 2c4g（内存 = CPU 核数 × 2 GiB）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      imports:
        - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
      stages:
        # CNB 不执行本地 git hooks，也没有修改已推送提交的 API，所以
        # Change-Id 只能在 CI 里检查，补不了；这里只报告不拦截。
        - name: check-commit-trailers
          script: |
            set -euo pipefail
            apt-get update && apt-get install nodejs -y && corepack enable npm && npm install -g pnpm
            node scripts/check-commit-trailers.mjs "$CNB_BEFORE_SHA" "$CNB_COMMIT"

        - name: push main
          script: |
            set -euo pipefail
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' "$GH_KEY" > ~/.git-credentials

            remote=https://github.com/NekoSekaiMoe/nanopi.git
            git fetch --quiet "$remote" main

            # 推送不代表成功：非 fast-forward 会被远端拒绝。把本地 HEAD 与
            # 远端 main 的关系摆到日志里，再推。
            if git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "fast-forward: $CNB_COMMIT is ahead of $remote main"
            else
              echo "not a fast-forward of $remote main; push will be rejected" >&2
              exit 1
            fi

# AI 助手（NPC）被 @ 时跑的流水线。cpus: 2 即 2c4g（内存 = 核数 x 2GiB）。
#
# install git hooks 这一步不能省：husky 只在 pnpm prepare 里执行，
# 而 pnpm install 的 --ignore-scripts 会把 prepare 一起跳过。hooks 装不上时
# .husky/commit-msg 不会运行，NPC 提交就没有 Change-Id。
$:
  issue.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
