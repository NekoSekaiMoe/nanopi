# 将 CNB 仓库上的改动镜像推送到 GitHub（NekoSekaiMoe/nanopi）。
#
# 只在 main 的 push 事件触发；GitHub 侧的反向镜像见
# .github/workflows/sync-to-cnb.yml。为避免互相覆盖，两侧都不用 force push。
# GH_KEY 由密钥仓库 shinytale/keys 的 env.yml 注入。

main:
  push:
    - name: mirror-to-github
      # 2 cpus = 2c4g（内存 = CPU 核数 × 2 GiB）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      imports:
        - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
      stages:
        # CNB 不执行本地 git hooks，也没有修改已推送提交的 API，所以
        # Change-Id 只能在 CI 里检查，补不了；这里只报告不拦截。
        - name: check-commit-trailers
          script: |
            set -euo pipefail
            apt-get update && apt-get install nodejs -y && corepack enable npm && npm install -g pnpm
            node scripts/check-commit-trailers.mjs "$CNB_BEFORE_SHA" "$CNB_COMMIT"

        - name: push main
          # 镜像逻辑在 scripts/mirror-main.mjs：GitHub 的连接偶尔被中途掐断
          # （GnuTLS handshake failed: The TLS connection was non-properly
          # terminated），传输层失败要重试，而「树相同 / 非快进」这类本地判定
          # 重试没有意义。脚本里分得清这两类，内联 bash 分不清。
          script: |
            set -euo pipefail
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' "$GH_KEY" > ~/.git-credentials
            node scripts/mirror-main.mjs --remote https://github.com/NekoSekaiMoe/nanopi.git

        - name: push tags
          # 逻辑在 scripts/mirror-tags.mjs，与 GitHub 侧的 Push tags to CNB 共用。
          # tag 判定（已存在且指向同一 commit 就跳过、指向不同就报错）重试没有
          # 意义，传输层失败才有，脚本里分得清这两类。
          script: |
            set -euo pipefail
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' "$GH_KEY" > ~/.git-credentials
            node scripts/mirror-tags.mjs --remote https://github.com/NekoSekaiMoe/nanopi.git

# PR 的预合并结果检查：这次改动合进 main 会不会丢东西。
#
# 事件选 pull_request.target 而不是 pull_request：后者拿的是「预合并后的提交」，
# 按定义已经把 main 的树合并进来了，回退永远查不出来。pull_request.target 用的是
# 合并前的目标分支最新提交，才是真正要比较的基线。反过来，它拿不到 PR 的代码，
# 所以从 CNB_PULL_REQUEST_SLUG / CNB_PULL_REQUEST_BRANCH 取源分支自己合一次。
#
# 这条流水线要变成「阻止合并」还需要在仓库设置里把 main 设为保护分支并勾选
# 「需要通过状态检查」，否则它只是一条会变红的记录。
main:
  pull_request.target:
    - name: merge-result
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      stages:
        - name: check-merge-result
          script: |
            set -euo pipefail
            cp -a . /tmp/base
            cd /tmp/base
            # 两侧都是 CNB 上的仓库，checkout 自带的只读令牌够用。
            git fetch --no-tags origin "+refs/heads/$CNB_PULL_REQUEST_BRANCH:refs/remotes/pr/head"
            node scripts/check-merge-result.mjs --base "refs/remotes/pr/head"

# AI 助手（NPC）被 @ 时跑的流水线。cpus: 2 即 2c4g（内存 = 核数 x 2GiB）。
#
# install git hooks 这一步不能省：husky 只在 pnpm prepare 里执行，
# 而 pnpm install 的 --ignore-scripts 会把 prepare 一起跳过。hooks 装不上时
# .husky/commit-msg 不会运行，NPC 提交就没有 Change-Id。
$:
  issue.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
