# CNB 上的失败构建要有人接着修（#319）。
#
# 平台没有「构建失败时跑一段」的事件，但每条 pipeline 都有 endStages：stages 跑完
# 它都会跑，而且它自己的结论不影响构建状态。钩子挂在 endStages 上，而不是在每条
# 流水线里各写一段——后者一定会漏掉没人想起来的那条。
#
# 报不报由脚本自己判（读构建状态），报什么由脚本里的提交标记去重：同一条分支的
# 同一个提交只报一次。endStages 不继承 stages 的结论，所以不能靠 `if` 只让失败时跑，
# 这也是「全部流水线都挂」不会刷屏的原因。

# 将 CNB 仓库上的改动镜像推送到 GitHub（NekoSekaiMoe/nanopi）。
#
# 只在 main 的 push 事件触发；GitHub 侧的反向镜像见
# .github/workflows/sync-to-cnb.yml。为避免互相覆盖，两侧都不用 force push。
# GH_KEY 由密钥仓库 shinytale/keys 的 env.yml 注入。

# 每个 job 的 endStages 都用这一段（锚点在 YAML 里必须先定义后引用）。
# allowFailure：钩子自己出错不能把构建状态改成失败，更不能盖掉原来的失败信息。
#
# 镜像里没有 node（默认构建镜像是 alpine，见 check-merge-result 那一段的注释），
# 也没有 cnb：脚本要用 cnb 读构建状态、写 Issue，所以先装。
# CNB_TOKEN 在 endStages 里默认只有构建详情只读，写 Issue 要显式加 scope。
x-notify-failure: &notify-failure
  - name: report-failure
    allowFailure: true
    env:
      CNB_TOKEN_SCOPE: repo-issue:rw,repo-notes:rw,repo-cnb-history:r
    script: |
      set -uo pipefail
      apt-get update && apt-get install nodejs -y
      corepack enable npm && npm install -g pnpm @cnbcool/cnb-cli
      node scripts/report-failed-check.mjs

# bundle 发到 AtomGit（atomgit.com/nanopi/releases-assets），给国内用户一条不绕
# GitHub Releases 的下载路径。安装入口是 install.js --mirror=<该仓库 README 里的
# URL>，资产名与 GitHub Release 一致（nanopi.js / nanopi-base.js /
# nanopi-minimal.js / SHA256SUMS），换源不改文件名。
#
# 两条流水线：nightly 每天从 main 重建一次，正式版由 GitHub 那一侧打出的 tag
# 镜像回 CNB 后触发（tag_push）。判定与推送都在 scripts/publish-atomgit.mjs 里：
# 它自己组装资产的目录、写 README 与 SHA256SUMS、提交、打 tag、推送。
#
# 发行仓库的写权限来自密钥仓库里的 ATOMGIT_KEY（imports 注入的环境变量），由
# --token-env ATOMGIT_KEY 指名交给 scripts/publish-atomgit.mjs；脚本不猜变量名，
# 少写这个参数时 --push 直接报错，而不是拿匿名身份去推、把失败拖到 git push。
# 正式版的 tag 由 GitHub 侧打出、由 main push 时的 mirror tags 带回 CNB，所以
# tag_push 里拿到的只有源码树；nightly 与正式版都在这条流水线里自己构建（三个
# 口味共用一次 install/build）。
#
# 要让 nightly 的 cron 生效，推送这份文件之后还需要在「云原生构建 → 定时任务」里
# 同步一次 main 分支：只有「本次推送的变更包含 .cnb.yml」才会自动同步。
x-atomgit-release: &atomgit-release
  # 2c4g 足够：单文件构建是纯 CPU 的 esbuild 打包，峰值内存约 4 GiB。
  runner:
    tags: cnb:arch:amd64
    cpus: 2
  imports:
    - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
  endStages: *notify-failure
  stages:
    - name: publish
      script: |
        set -euo pipefail
        # build-single-file.mjs 自己跑 pnpm install 与 build:offline，产物落在
        # 传入的目录里；三个口味共用同一次 install/build，只有 bundle 那一步
        # 看 NANOPI_BUILD_FLAVOR。
        node scripts/build-single-file.mjs --offline-model-data --out release-assets
        for flavor in base minimal; do
          NANOPI_BUILD_FLAVOR="$flavor" node scripts/build-coding-agent-single-file.mjs --out "release-assets/nanopi-$flavor.js"
        done
        # 发出去的包要能跑：装失败的产品比不发更糟。
        for bundle in nanopi nanopi-base nanopi-minimal; do
          node "release-assets/$bundle.js" --version
          node "release-assets/$bundle.js" --help > /dev/null
        done
        node scripts/publish-atomgit.mjs --tag "$TAG" --input release-assets --work "${TMPDIR:-/tmp}/atomgit-assets" --token-env ATOMGIT_KEY --push

        # 正式版的流程是反的：GitHub 打 tag → GitHub 构建 Release → tag 才回到
        # CNB。这一步把「构建」钉在 CNB 上，正式的 GitHub Release 仍由
        # build-binaries.yml 负责（它拒绝改动已发布的 Release）。也就意味着两边
        # 都构建了一遍，但换掉其中一条流水线等于换掉发布流程本身，不在这次改动
        # 的范围里。用 gh 直接开一个 tag 上的 workflow，CNB 的 CNB_TOKEN 不在
        # 这里用：它出不了本仓库。
        case "$TAG" in
          v*) GH_TOKEN="$GH_KEY" gh workflow run build-binaries.yml --repo NekoSekaiMoe/nanopi --ref main -f tag="$TAG" ;;
        esac

main:
  push:
    - name: mirror-to-github
      # 2 cpus = 2c4g（内存 = CPU 核数 × 2 GiB）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      imports:
        - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
      endStages: *notify-failure
      stages:
        # CNB 不执行本地 git hooks，也没有修改已推送提交的 API，所以
        # Change-Id 只能在 CI 里检查，补不了；这里只报告不拦截。
        - name: check-commit-trailers
          script: |
            set -euo pipefail
            apt-get update && apt-get install nodejs -y && corepack enable npm && npm install -g pnpm
            node scripts/check-commit-trailers.mjs "$CNB_BEFORE_SHA" "$CNB_COMMIT"

        # main 与 tag 各跑一次镜像。判定在 scripts/mirror-main.mjs 与
        # scripts/mirror-tags.mjs（与 GitHub 侧共用），入口是 scripts/mirror.mjs。
        # 传输层失败要重试（GitHub 偶尔在中途掐断：GnuTLS handshake failed:
        # The TLS connection was non-properly terminated），「树相同 / 非快进 /
        # tag 已指向别的 commit」这类判定重试没有意义，脚本里分得清这两类，
        # 内联 bash 分不清。凭据由入口自己落进一个进程私有的 credential store：
        # 远端 URL 不带 token，token 也不经过这里的 shell 与 ~/.git-credentials。
        - name: mirror main and tags
          script: |
            set -euo pipefail
            remote=https://github.com/NekoSekaiMoe/nanopi.git
            node scripts/mirror.mjs main --remote "$remote" --token-user x-access-token --token-env GH_KEY
            node scripts/mirror.mjs tags --remote "$remote" --token-user x-access-token --token-env GH_KEY

# PR 的预合并结果检查：这次改动合进 main 会不会丢东西。
#
# 事件选 pull_request.target 而不是 pull_request：后者拿的是「预合并后的提交」，
# 按定义已经把 main 的树合并进来了，回退永远查不出来。pull_request.target 用的是
# 合并前的目标分支最新提交，才是真正要比较的基线。反过来，它拿不到 PR 的代码，
# 所以从 CNB_PULL_REQUEST_SLUG / CNB_PULL_REQUEST_BRANCH 取源分支自己合一次。
#
# 这条流水线要变成「阻止合并」还需要在仓库设置里把 main 设为保护分支并勾选
# 「需要通过状态检查」，否则它只是一条会变红的记录。
#
# 缩进不能丢：pull_request.target 是上面 main: 的子键。e1a11be62 曾把它写成顶格的
# 第二个 main:，YAML 直接拒绝整份文件（duplicated mapping key，见 #246）。
  # 每天重建一次 nightly 的 bundle 并发到 AtomGit。cron 按系统时区
  # （Asia/Shanghai）算，16:00 对应 GitHub nightly 那次 00:00 UTC。
  #
  # 名义上的 24h 是「上一次跑完之后隔一天」的意思，不是硬时限：CNB 定时任务的
  # 触发身份是最后修改这份配置并推送的人，人被移出仓库时任务会静默不跑。
  "crontab: 0 16 * * *":
    - <<: *atomgit-release
      env:
        TAG: nightly

  pull_request.target:
    - name: merge-result
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      endStages: *notify-failure
      stages:
        - name: check-merge-result
          # fetch PR 分支、合并、比对都在 scripts/check-merge-result-cnb.mjs 里。
          # 退出码：0 通过，1 这次合并会丢 main 上已有的文件，2 base 缺失。
          script: |
            set -euo pipefail
            # 默认构建镜像里没有 node（cnb-4u8-1k5s1gkfc 报 sh: node: command not found）。
            apt-get update && apt-get install nodejs -y
            node scripts/check-merge-result-cnb.mjs

# 兜底：没被上面的 main 规则接住的事件（新分支的 push、手动触发）也要有钩子。
# `$` 的匹配是在 glob 之后，两类规则不会互相顶掉。
$:
  push:
    - endStages: *notify-failure
  pull_request.target:
    - endStages: *notify-failure
  pull_request.merged:
    - endStages: *notify-failure
  # 正式版的 tag 在 GitHub 上打，再由 main push 时的 mirror tags 带回 CNB，于是
  # 这里的 tag_push 才被触发。tag 到的时候 CNB 上只有源码树，没有产物，所以这条
  # 流水线自己构建。
  #
  # 目标 tag 用 CNB_BRANCH（tag 事件里它就是 tag 名）：publish-atomgit.mjs 只
  # 推送 `+refs/tags/$TAG`，不碰发行仓库的 main，所以补发历史版本也不会把主分支
  # 的「最新一份」退回去。
  #
  # 一次发布会触发两条：GitHub tag push → sync-to-cnb 推 main 与 tags 回来，
  # 于是 tag_push 与这次 main push 的镜像各开一份。tag_push 只碰 tag，镜像只碰
  # main，撞不上。
  web_trigger:
    - <<: *atomgit-release
      env:
        TAG: $TAG
  tag_push:
    - <<: *atomgit-release
      env:
        TAG: $CNB_BRANCH

  # AI 助手（NPC）被 @ 时跑的流水线。cpus: 2 即 2c4g（内存 = 核数 x 2GiB）。
  #
  # install git hooks 这一步不能省：husky 只在 pnpm prepare 里执行，
  # 而 pnpm install 的 --ignore-scripts 会把 prepare 一起跳过。hooks 装不上时
  # .husky/commit-msg 不会运行，NPC 提交就没有 Change-Id。
  issue.comment@npc:
    - runner:
        cpus: 2
      endStages: *notify-failure
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - runner:
        cpus: 2
      endStages: *notify-failure
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
