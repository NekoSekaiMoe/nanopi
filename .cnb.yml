# 将 CNB 仓库上的改动镜像推送到 GitHub（NekoSekaiMoe/nanopi）。
#
# 只在 main 的 push 事件触发；GitHub 侧的反向镜像见
# .github/workflows/sync-to-cnb.yml。为避免互相覆盖，两侧都不用 force push。
# GH_KEY 由密钥仓库 shinytale/keys 的 env.yml 注入。

main:
  push:
    - name: mirror-to-github
      # 2 cpus = 2c4g（内存 = CPU 核数 × 2 GiB）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      imports:
        - https://cnb.cool/shinytale/keys/-/blob/main/env.yml
      stages:
        # CNB 不执行本地 git hooks，也没有修改已推送提交的 API，所以
        # Change-Id 只能在 CI 里检查，补不了；这里只报告不拦截。
        - name: check-commit-trailers
          script: |
            set -euo pipefail
            apt-get update && apt-get install nodejs -y && corepack enable npm && npm install -g pnpm
            node scripts/check-commit-trailers.mjs "$CNB_BEFORE_SHA" "$CNB_COMMIT"

        - name: push main
          script: |
            set -euo pipefail
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' "$GH_KEY" > ~/.git-credentials

            remote=https://github.com/NekoSekaiMoe/nanopi.git
            git fetch --quiet "$remote" main

            # 推送不代表成功：非 fast-forward 会被远端拒绝。判定方向是
            # 「远端 tip 是不是本地 HEAD 的祖先」，即 FETCH_HEAD 在前、
            # HEAD 在后；写反了就变成「远端是否领先于我们」，那恰好是推送
            # 会被拒绝的情形，等于把 guard 钉死在反面。
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "fast-forward: $CNB_COMMIT is ahead of $remote main"
            else
              echo "not a fast-forward of $remote main; push will be rejected" >&2
              exit 1
            fi

            # 快照本地 HEAD 的树，push 后再回来比一次内容。单看 push 的退出码
            # 不够：CNB 的 merge request 会把每个提交重放到 base 上，重放出的树
            # 可能与当前 main 的树相同而与上游内容无关，replay 之后再合并就会
            # 「干净合并」成一个把我们的改动回退掉的树，GitHub 侧却显示成功。
            local_tree=$(git rev-parse HEAD^{tree})

            # push protection 扫的是待推的整个提交区间，不是推送后的树：历史里留着明文
            # （后来在树上改成 base64 也一样），每次推 main 都是非 fast-forward，
            # 都会被 GH013 拒掉。这类祖先提交登记在文件里，等远端自己收下它们之后就不再
            # 阻塞。只绕过它们，别的原因被拦照样失败（下面没有任何 || true）。
            push_protection_blocked=scripts/github-push-protection-blocked.txt
            blocked=$(sed -e 's/#.*//' "$push_protection_blocked" | awk 'NF { print $1 }')
            secret_patterns='GOCSPX-[A-Za-z0-9_-]{20,}|[0-9]{10,}-[a-z0-9]{20,}\.apps\.googleusercontent\.com'

            # 登记只对「这些提交已不在树上」成立。树里重新出现明文，登记就不该再放行。
            # shellcheck disable=SC2086
            blocked_in_tree=$(git grep -lE "$secret_patterns" HEAD -- . | head -n 1)
            if [ -n "$blocked" ] && [ -z "$blocked_in_tree" ]; then
              # shellcheck disable=SC2086
              pending=$(git rev-list --no-walk $blocked | git rev-list --stdin --not FETCH_HEAD | head -n 1)
            else
              [ -z "$blocked_in_tree" ] || echo "tree still carries push-protection literals in $blocked_in_tree" >&2
              # 没有登记就是空串：下面直接普通 push，别让 git rev-list 收到空参数。
              pending=""
            fi

            if [ -z "$pending" ]; then
              # 上一次推的是合成提交，远端 main 因此不在本地历史里：在远端 tip 上现造一个
              # 合并提交把它接回来，两侧谁也不丢，也不用 force。树取本地 HEAD 的，
              # 所以内容仍是 CNB 这份。
              if git cat-file -e FETCH_HEAD^{commit} 2>/dev/null && ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
                merge=$(git commit-tree "$local_tree" -p HEAD -p FETCH_HEAD -m "Merge GitHub main into $CNB_COMMIT")
                echo "diverged histories; pushing merge $merge of $CNB_COMMIT and the GitHub tip" >&2
                git push --quiet "$remote" "$merge:refs/heads/main"
              else
                git push --quiet "$remote" HEAD:refs/heads/main
              fi
            else
              if [ "$(git rev-parse HEAD)" = "$pending" ]; then
                echo "HEAD is recorded as blocked and the remote has not taken it yet; refusing to mirror" >&2
                exit 1
              fi
              echo "pending commits flagged by GitHub push protection:" >&2
              # shellcheck disable=SC2086
              git rev-list --no-walk $blocked | git rev-list --stdin --not FETCH_HEAD | while read -r sha; do
                echo "  $sha $(git log -1 --format=%s "$sha")" >&2
              done
              # 这些提交已在 CNB main 上、远端还没有。推 HEAD 的树、父提交取远端 tip：
              # 远端拿到同样的内容。代价是两侧 sha 分叉，下一次镜像由上面的分支做合并。
              merge=$(git commit-tree "$local_tree" -p FETCH_HEAD -m "Merge CNB main $CNB_COMMIT")
              echo "pushing $merge (tree of $CNB_COMMIT on top of the GitHub tip)" >&2
              git push --quiet "$remote" "$merge:refs/heads/main"
            fi

            # 远端树必须与本地树逐字节一致。不一致说明落上去的不是我们这份
            # 内容（replay 造成的静默丢失就长这样），此时不能算镜像成功。
            git fetch --quiet "$remote" main
            remote_tree=$(git rev-parse FETCH_HEAD^{tree})
            if [ "$local_tree" != "$remote_tree" ]; then
              echo "tree mismatch after push:" >&2
              echo "  local  $local_tree" >&2
              echo "  remote $remote_tree" >&2
              git diff --stat "$local_tree" "$remote_tree" >&2 || true
              exit 1
            fi
            echo "mirrored $CNB_COMMIT: $remote_tree"
        # tag 同步与 main 是两件事：main 用 fast-forward 断言加推送后树比对，
        # tag 是「已存在且指向同一 commit 就跳过、指向不同 commit 就报错」。
        # 两个方向都不 force，所以 tag 一旦在两侧分叉就会永久卡住，需人介入。
        - name: push tags
          script: |
            set -eu
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' > ~/.git-credentials

            remote=https://github.com/NekoSekaiMoe/nanopi.git

            # 远端 tag 落到独立命名空间 refs/remote-tags/，不写 refs/tags/：写进去之后
            # 下面的循环会把 fetch 来的远端 tag 当成「本地也有」，远端不存在的 tag 就
            # 永远判不出来。（也不能用 --prune-tags，那会按本地的 tag 名单去清远端。）
            git fetch --quiet --force "$remote" 'refs/tags/*:refs/remote-tags/tags/*'

            # 只处理本地的 annotated tag，即能 peel 成 commit 的那类。同名轻量 tag 在
            # 另一侧是 annotated 不算冲突：判定是「已存在且指向不同 commit 才报错」，
            # 不是对象 id 不等就报错。
            pending=""
            # 用管道喂 while 会把循环放进子 shell，pending 就留不到循环外，所以先落临时文件。
            tags_file=$(mktemp)
            trap 'rm -f "$tags_file"' EXIT
            git for-each-ref --format='%(objectname) %(objecttype) %(refname)' refs/tags | awk '$2 == "tag"' > "$tags_file"
            while read -r obj type ref; do
              name=${ref#refs/tags/}
              remote_obj=$(git rev-parse --verify --quiet "refs/remote-tags/tags/$name" || true)
              [ "$remote_obj" = "$obj" ] && continue
              if [ -n "$remote_obj" ]; then
                local_commit=$(git rev-parse "$obj^{commit}")
                remote_commit=$(git rev-parse "$remote_obj^{commit}")
                if [ "$local_commit" != "$remote_commit" ]; then
                  echo "tag $name points to different commits on both sides; refusing to overwrite:" >&2
                  echo "  local  $obj ($local_commit)" >&2
                  echo "  remote $remote_obj ($remote_commit)" >&2
                  exit 1
                fi
                echo "tag $name exists on the remote ($remote_obj); not rewriting it"
                continue
              fi
              pending="$pending $name"
            done < "$tags_file"

            if [ -z "$(echo "$pending" | tr -d ' ')" ]; then
              echo "no new annotated tags to mirror"
              exit 0
            fi

            # 不带 force：两个方向都不覆盖已有 tag，分叉在上面已经拦住了。
            for name in $pending; do
              git push --quiet "$remote" "refs/tags/$name:refs/tags/$name"
            done

            # push 的退出码不足以证明落上去的是本地这个对象，重新 fetch 后逐字节比一次。
            git fetch --quiet --force "$remote" 'refs/tags/*:refs/remote-tags/tags/*'
            for name in $pending; do
              local_obj=$(git rev-parse "refs/tags/$name")
              remote_obj=$(git rev-parse "refs/remote-tags/tags/$name")
              if [ "$local_obj" != "$remote_obj" ]; then
                echo "tag $name mismatch after push: local $local_obj remote $remote_obj" >&2
                exit 1
              fi
              echo "mirrored tag $name: $remote_obj"
            done

# AI 助手（NPC）被 @ 时跑的流水线。cpus: 2 即 2c4g（内存 = 核数 x 2GiB）。
#
# install git hooks 这一步不能省：husky 只在 pnpm prepare 里执行，
# 而 pnpm install 的 --ignore-scripts 会把 prepare 一起跳过。hooks 装不上时
# .husky/commit-msg 不会运行，NPC 提交就没有 Change-Id。
$:
  issue.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
  pull_request.comment@npc:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: install git hooks
          script: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm prepare
        - name: npc go
          type: npc:go
