packages:
  - packages/*
  - packages/coding-agent/examples/extensions/with-deps
  - packages/coding-agent/examples/extensions/custom-provider-anthropic
  - packages/coding-agent/examples/extensions/custom-provider-gitlab-duo
  - packages/coding-agent/examples/extensions/sandbox

# Link same-repo packages when the requested version range is satisfied by the
# local package, mirroring npm workspaces behavior. Inter-package dependencies
# use plain semver ranges, not the workspace: protocol.
linkWorkspacePackages: true

# pnpm 12 的默认值，这里写成声明而不是靠默认。这不是无意义的复述：
# 它同时决定了 lockfile 的表示方式。packages/ai 把 zod 声明成 optional peer，
# 开启时 pnpm 会把 zod 装进 importer 的 dependencies 段供 peer 解析，于是
# lock 里 packages/ai 多出 zod@4.6.7、@anthropic-ai/sdk 与 openai 的 zod 从
# 3.25.76 提到 4.6.7（68c5d7527 清 zod advisory 的实际来源）。关掉它这些行会
# 消失，advisory 回来，声明的 zod 4.6.7 也成了一个没人实现的空话。改这里等于
# 改 lock，需要连带跑一次 pnpm install --lockfile-only 并复核 diff。
autoInstallPeers: true

overrides:
  protobufjs: 7.6.6

# 36 小时冷却期，挡住刚发布的供应链投毒版本。
# 单位是分钟，不是天：pnpm 的惯例是分钟（默认 1440 = 1 天），写 2 只等于 2 分钟，
# 比默认还松。见 .agents/notes/implemented/process/2026-11-06-minimum-release-age-is-minutes.md。
#
# 这台 lockfile 是按旧值装的，把阈值抬到 2160 会有条目落进冷却窗，pnpm 的
# lockfile 校验（trustLockfile: false 时每装一次都跑）会直接 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION。
# 下面这些是「已经在 main 上跑了一段时间、只是还没满 36 小时」的版本，按版本号
# 拉清单放行，不回退阈值。它们是显式豁免，不是政策的一部分：下次同包升级不受影响，
# 老条目过期后由 minimumReleaseAgeExcludePrune 在写 lock 时自动清掉。
#
# ignoreMissingTime: 少数包（如 @biomejs/cli-android-arm64@2.6.3）的 manifest
# 没带 version 级发布时间字段，pnpm 会按"版本不在 manifest 里"拒绝安装。
# 这类包仍受 integrity、签名、tarball URL 绑定校验，所以放行仍然安全。
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@1.6.0'
  - '@aws-sdk/client-bedrock-runtime@3.1163.0'
  - '@aws-sdk/token-providers@3.1163.0'
  - '@google/genai@3.0.0'
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - 'lucide-react@1.69.0'
  - 'minimatch@11.0.5'
  - 'openai@7.52.0'
  - 'undici@8.12.4'

allowBuilds:
  '@google/genai': true
  autoevals: true
  canvas: true
  cpu-features: true
  esbuild: true
  # protobufjs 的唯一 script 是 postinstall：只在依赖方声明的版本不满足它自己
  # 的 versionScheme（"~"）时往 stderr 打一行警告，装出来的 dist 与跳过脚本时
  # 逐字节相同。false 是有意的「拒绝」，不是待审：删掉这一行 pnpm 会把它当成
  # 未审批的构建脚本并让 install 失败。
  pnpm: false
  protobufjs: false
  ssh2: true
